<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projecten - Portfolio van Boen</title>
    <link rel="stylesheet" href="style.css">
    <script src="projecten.js" defer></script>
  </head>
  <body>
    <header>
      <nav aria-label="Hoofdnavigatie">
        <ul>
          <li><a href="index.html">Whoami</a></li>
          <li><a href="projecten.html" aria-current="page">Projecten</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Projecten</h1>
      <p>Hieronder vind je een overzicht van mijn projecten.</p>
      <div class="project-keuzes">
        <div>
          <label for="categorie-filter">Filter op categorie</label>
          <select id="categorie-filter">
            <option value="alle">Alle projecten</option>
            <option value="Groepsproject">Groepsproject</option>
            <option value="Individueel project">Individueel project</option>
          </select>
        </div>
        <div>
          <label for="sorteer-keuze">Sorteer op naam</label>
          <select id="sorteer-keuze">
            <option value="az">Naam A–Z</option>
            <option value="za">Naam Z–A</option>
          </select>
        </div>
      </div>
      <p id="aantal-projecten" role="status" aria-live="polite"></p>
      <div id="projecten-lijst"></div>
      <noscript>
        <p>Schakel JavaScript in om de projectenlijst te bekijken.</p>
      </noscript>
    </main>

    <footer>
      <p>&copy; portfolio van Boen</p>
    </footer>
  </body>
</html>
